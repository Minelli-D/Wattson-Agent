# Who may reach KubeAI and the model (namespace KUBEAI_NAMESPACE). k8s/kubeai.sh fills in the
# ${...} values from settings.env and applies these three rules there, after the Model.
#
# Without them any pod of the cluster could ask the KubeAI proxy (and so the model), or a model
# pod directly. With them:
#   1. no pod of the namespace takes any connection, except what rules 2 and 3 allow. This rule
#      selects every pod, also one that KubeAI starts later: nothing is left open;
#   2. the KubeAI pod (operator and OpenAI proxy, Deployment "kubeai" of the chart, port "http"
#      8000): the proxy port only from the triage pods of the app (app=${TRIAGE} in the namespace
#      ${K8S_NAMESPACE}), from its orchestrator pods (app=${ORCHESTRATOR}: the small model of the
#      Guard) and from the pods of this namespace; its metrics port 8080 only from the pods of this
#      namespace (the autoscaler of one KubeAI pod reads the metrics of all of them);
#   3. the model pods (KubeAI puts app=model and app.kubernetes.io/managed-by=kubeai on each,
#      llama.cpp listens on 8000): only from the KubeAI pod, which sends the requests there.
# Only ingress: going out stays open (the operator talks to the API server; a model pod downloads
# the model from Hugging Face).
# The health checks of the kubelet (KubeAI :8081, the model pods :8000) come from the node, and a
# NetworkPolicy does not block the node (the triage and knowledge pods are checked the same way).
# KubeAI 0.24.0 has no admission webhook and no conversion webhook (its CRD has conversion
# "None"), so the API server never calls into this namespace.
# Another app that should use the model: add its pods to the first "from" of rule 2.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME}-kubeai-deny-ingress
  labels: { app.kubernetes.io/part-of: ${APP_NAME}, app.kubernetes.io/component: triage }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME}-kubeai-proxy
  labels: { app.kubernetes.io/part-of: ${APP_NAME}, app.kubernetes.io/component: triage }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: kubeai, app.kubernetes.io/instance: kubeai }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ${K8S_NAMESPACE} } }
          podSelector: { matchLabels: { app: ${TRIAGE} } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ${K8S_NAMESPACE} } }
          podSelector: { matchLabels: { app: ${ORCHESTRATOR} } }
        - podSelector: {}
      ports:
        - { protocol: TCP, port: ${KUBEAI_PROXY_PORT} }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME}-kubeai-models
  labels: { app.kubernetes.io/part-of: ${APP_NAME}, app.kubernetes.io/component: triage }
spec:
  podSelector:
    matchLabels: { app: model, app.kubernetes.io/managed-by: kubeai }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: kubeai, app.kubernetes.io/instance: kubeai } }
      ports:
        - { protocol: TCP, port: 8000 }
