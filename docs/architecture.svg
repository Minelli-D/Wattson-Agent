<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <title>Wattson Agent: architecture (conceptual view, no environment details)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a0aec0"/>
    </marker>
  </defs>
  <style>
    .t { font-family: "DejaVu Sans", Arial, sans-serif; fill: #1a202c; }
    .h { font-size: 18px; font-weight: bold; }
    .s { font-size: 13px; fill: #4a5568; }
    .b { font-size: 14px; font-weight: bold; }
    .n { font-size: 12px; fill: #2d3748; }
    .box { rx: 10; stroke-width: 1.6; }
    .edge { fill: none; stroke: #4a5568; stroke-width: 1.8; marker-end: url(#arr); }
    .soft { fill: none; stroke: #a0aec0; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrDash); }
    .lbl { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #2d3748; }
  </style>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="30" y="40" class="t h">Wattson Agent: how it works</text>
  <text x="30" y="62" class="t s">Asks in the terminal, read-only evidence, and nothing runs without your yes.</text>

  <!-- ZONE: your laptop -->
  <rect x="30" y="90" width="360" height="560" class="box" fill="#f7fafc" stroke="#2b6cb0" stroke-dasharray="0"/>
  <text x="50" y="118" class="t b" fill="#2b6cb0">YOUR LAPTOP</text>

  <rect x="60" y="140" width="300" height="100" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="80" y="170" class="t b">wattson CLI</text>
  <text x="80" y="192" class="t n">You ask, read the plan, type yes</text>
  <text x="80" y="212" class="t n">Shows the exact prompt before it runs</text>

  <rect x="60" y="270" width="300" height="110" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="80" y="300" class="t b">Connector</text>
  <text x="80" y="322" class="t n">Runs only the commands the agent asks for</text>
  <text x="80" y="342" class="t n">git (status, log, diff) and kubectl (read-only)</text>
  <text x="80" y="362" class="t n">Removes secrets before anything leaves</text>

  <rect x="60" y="410" width="300" height="110" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="80" y="440" class="t b">Claude Code</text>
  <text x="80" y="462" class="t n">Runs the approved prompt in your repo</text>
  <text x="80" y="482" class="t n">Asks its own permission questions</text>
  <text x="80" y="502" class="t n">The only part that changes files</text>

  <rect x="60" y="550" width="300" height="80" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="80" y="580" class="t b">Your repository</text>
  <text x="80" y="602" class="t n">Code, history, and the working tree</text>

  <!-- ZONE: your cluster -->
  <rect x="470" y="90" width="590" height="560" class="box" fill="#f0fff4" stroke="#2f855a"/>
  <text x="490" y="118" class="t b" fill="#2f855a">YOUR CLUSTER</text>

  <rect x="500" y="140" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="520" y="170" class="t b">Orchestrator</text>
  <text x="520" y="192" class="t n">Runs the task in a fixed order</text>
  <text x="520" y="212" class="t n">Pauses and asks you when it must</text>
  <text x="520" y="232" class="t n">Keeps task history, not prompts</text>

  <rect x="790" y="140" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="810" y="170" class="t b">Guard and shield</text>
  <text x="810" y="192" class="t n">Checks requests against your rules</text>
  <text x="810" y="212" class="t n">Removes prompt-injection text</text>
  <text x="810" y="232" class="t n">Stops malicious or out-of-scope work</text>

  <rect x="500" y="290" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="520" y="320" class="t b">Triage</text>
  <text x="520" y="342" class="t n">Classifies the request:</text>
  <text x="520" y="362" class="t n">help, investigation or engineering</text>
  <text x="520" y="382" class="t n">Says how sure it is</text>

  <rect x="790" y="290" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="810" y="320" class="t b">Knowledge agent</text>
  <text x="810" y="342" class="t n">Finds the matching runbooks</text>
  <text x="810" y="362" class="t n">Read-only, names the documents used</text>
  <text x="810" y="382" class="t n">Adds past lessons from memory</text>

  <rect x="500" y="440" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="520" y="470" class="t b">Model service</text>
  <text x="520" y="492" class="t n">Small language model on CPU</text>
  <text x="520" y="512" class="t n">Starts on demand, stops when idle</text>
  <text x="520" y="532" class="t n">Used by triage and the Guard</text>

  <rect x="790" y="440" width="250" height="110" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="810" y="470" class="t b">Traces and dashboard</text>
  <text x="810" y="492" class="t n">Timings and labels, never content</text>
  <text x="810" y="512" class="t n">Grafana shows tasks, triage, Guard</text>
  <text x="810" y="532" class="t n">and the model's speed</text>

  <rect x="500" y="580" width="540" height="50" class="box" fill="#fffaf0" stroke="#c05621"/>
  <text x="520" y="610" class="t n" fill="#7b341e">Agents hold no laptop credentials. Only the approved prompt reaches Claude Code.</text>

  <!-- ZONE: external -->
  <rect x="1110" y="90" width="260" height="560" class="box" fill="#faf5ff" stroke="#6b46c1" stroke-dasharray="0"/>
  <text x="1130" y="118" class="t b" fill="#6b46c1">OUTSIDE SERVICES</text>

  <rect x="1130" y="140" width="220" height="150" class="box" fill="#faf5ff" stroke="#6b46c1"/>
  <text x="1150" y="170" class="t b">Grimoire</text>
  <text x="1150" y="192" class="t n">Your knowledge base of runbooks</text>
  <text x="1150" y="212" class="t n">Reached over a secure link</text>
  <text x="1150" y="232" class="t n">Read-only: nothing is written back</text>

  <rect x="1130" y="320" width="220" height="130" class="box" fill="#faf5ff" stroke="#6b46c1"/>
  <text x="1150" y="350" class="t b">Memory (optional)</text>
  <text x="1150" y="372" class="t n">Past lessons for Claude Code</text>
  <text x="1150" y="392" class="t n">Read-only, a few lessons</text>

  <rect x="1130" y="480" width="220" height="150" class="box" fill="#faf5ff" stroke="#6b46c1"/>
  <text x="1150" y="510" class="t b">You</text>
  <text x="1150" y="532" class="t n">Answer the questions</text>
  <text x="1150" y="552" class="t n">Approve with yes</text>
  <text x="1150" y="572" class="t n">Read the results</text>

  <!-- edges -->
  <path d="M360,195 L500,195" class="edge" style="marker-start:url(#arr);"/>
  <text x="368" y="186" class="lbl">ask, answers</text>

  <path d="M360,325 L500,200" class="soft"/>
  <text x="372" y="290" class="lbl">evidence</text>

  <path d="M625,250 L625,290" class="edge"/>
  <text x="634" y="276" class="lbl">classify</text>

  <path d="M750,195 L790,195" class="soft"/>
  <text x="752" y="186" class="lbl">checks</text>

  <path d="M790,345 L750,345" class="edge" style="marker-end:none; marker-start:url(#arr);"/>
  <text x="752" y="336" class="lbl">runbooks</text>

  <path d="M625,400 L625,440" class="edge"/>
  <text x="634" y="426" class="lbl">model calls</text>

  <path d="M1130,215 L1040,215" class="edge" style="marker-end:none; marker-start:url(#arr);"/>
  <text x="1048" y="206" class="lbl">read-only</text>

  <path d="M1130,385 L1040,385" class="soft" style="marker-end:none; marker-start:url(#arrDash);"/>
  <text x="1048" y="376" class="lbl">lessons</text>

  <path d="M1040,520 L1130,520" class="soft"/>
  <text x="1048" y="512" class="lbl">questions</text>


  <!-- flow strip -->
  <rect x="30" y="690" width="1340" height="110" class="box" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="50" y="718" class="t b">One task, step by step</text>
  <text x="50" y="744" class="t n">1 You ask</text>
  <text x="170" y="744" class="t n">2 Guard checks the request</text>
  <text x="380" y="744" class="t n">3 Triage picks the workflow</text>
  <text x="580" y="744" class="t n">4 Runbooks are found</text>
  <text x="740" y="744" class="t n">5 Evidence is collected (read-only)</text>
  <text x="50" y="772" class="t n">6 Shield removes injected text</text>
  <text x="290" y="772" class="t n">7 You read the prompt and type yes</text>
  <text x="560" y="772" class="t n">8 Claude Code runs it in your repo</text>
  <text x="840" y="772" class="t n">9 Every step is traced for the dashboard</text>
</svg>
